# source : https://github.com/catppuccin/tmux
# git clone -b v2.1.2 https://github.com/catppuccin/tmux.git $TMUX_CONFIG_DIR/plugins/catppuccin/tmux

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha" # latte, frappe, macchiato, or mocha
# set -g @catppuccin_date_time_text ' %d/%m %H:%M'

# STATUS LINE

# Put the status line at the top
set -g status-position top

# set the status bar to be transparent
set -g @catppuccin_status_background "none"
# set -g @catppuccin_status_background "#{@thm_surface_0}"

# Left side
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[bg=#{@thm_peach}#,fg=#{@thm_bg}],#[bg=#{@thm_blue}#,fg=#{@thm_bg}]}  #S "

# Right side
# set -g status-right-length 100
# set -g status-right "#[bg=#{@thm_bg},fg=#{@thm_surface_0}]"

# WINDOWS
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_middle_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_number_position "right"
set-window-option -g window-status-separator ""

# TODO: add the changing colors on the window numerotation when prefix key is active
# default window
set -g @catppuccin_window_text "#[bg=#{@thm_surface_0}, fg=#{@thm_overlay_2}] #W"
set -g @catppuccin_window_text_color ""
set -g @catppuccin_window_number "#[fg=#{@thm_lavender} bold]#I "
set -g @catppuccin_window_number_color ""

# current window
set -g @catppuccin_window_current_text "#[bg=#{@thm_surface_1}] #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_current_text_color ""
set -g @catppuccin_window_current_number "#[fg=#{@thm_lavender} bold]#I "
set -g @catppuccin_window_current_number_color ""
