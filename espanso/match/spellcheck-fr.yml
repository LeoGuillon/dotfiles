# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
# ───────────────────────────────────────────────────────────────────────────────

matches:
  # —————————————————————————————————————————————————————————————————————————————
  # (ACCENTS)
  # usually small words with several accents letters
  # can be tedious to write with ergo-l layout

  # e -> é

  # a bit of self-promoting heh ?
  - trigger: "ecole polytechnique"
    replace: "École Polytechnique"
    word: true

  - trigger: "deja"
    replace: "déjà"
    word: true
    propagate_case: true

  # c -> ç
  - trigger: "ca"
    replace: "ça"
    word: true
    propagate_case: true

  # ────────────────────────────────────────────────────────────────────────────────
  # (AUTRES)

  - trigger: "latex"
    replace: "LaTeX"
    word: true

  - trigger: "quobuz"
    replace: "qobuz"
    word: true
    propagate_case: true

  - trigger: "wifi"
    replace: "WiFi"
